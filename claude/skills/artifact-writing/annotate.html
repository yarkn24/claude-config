<!-- Reader marks layer: keep unchanged; content root is the element with data-annotate. -->
<style>
:root{--hl-green:rgba(74,222,128,.32);--hl-blue:rgba(96,165,250,.38);--hl-pink:rgba(244,114,182,.36);--hl-orange:rgba(251,120,50,.40)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--hl-green:#b9e6b0;--hl-blue:#b8d8f5;--hl-pink:#f7c3dc;--hl-orange:#fbbf7a}}
:root[data-theme="light"]{--hl-green:#b9e6b0;--hl-blue:#b8d8f5;--hl-pink:#f7c3dc;--hl-orange:#fbbf7a}
.am{cursor:pointer;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.am[data-k="hl"]{background:var(--hl)}
.am[data-k="hl"][data-c="green"]{background:var(--hl-green)}
.am[data-k="hl"][data-c="blue"]{background:var(--hl-blue)}
.am[data-k="hl"][data-c="pink"]{background:var(--hl-pink)}
.am[data-k="hl"][data-c="orange"]{background:var(--hl-orange)}
.am[data-k="ul"]{text-decoration:underline 3px var(--clay);text-underline-offset:4px;text-decoration-skip-ink:none}
.am-ui{font:500 13px/1.3 var(--sans);color:var(--fg);z-index:20}
.am-ui[hidden]{display:none!important}
#am-bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:1000;display:flex;flex-wrap:wrap;width:max-content;max-width:calc(100vw - 16px);gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#am-bar button,.am-panel button{font:inherit;color:var(--fg);background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}
#am-bar button:hover,.am-panel button:hover{background:var(--line)}
#am-bar [data-a="hl"]:not(.sw)::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--hl);margin-right:6px;outline:1px solid var(--line2)}
#am-bar .am-sw{display:flex;align-items:center;gap:5px;padding:0 6px}
#am-bar .sw{width:22px;height:22px;padding:0;border-radius:50%;outline:1px solid var(--line2)}
#am-bar .sw:hover{outline:2px solid var(--fg)}
#am-bar .sw[data-c="green"]{background:var(--hl-green)}
#am-bar .sw[data-c="blue"]{background:var(--hl-blue)}
#am-bar .sw[data-c="pink"]{background:var(--hl-pink)}
#am-bar .sw[data-c="orange"]{background:var(--hl-orange)}
#am-bar [data-a="ul"]{text-decoration:underline 3px var(--clay);text-underline-offset:4px}
.am-pill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--mut);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;cursor:pointer}
.am-panel{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));max-height:50vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px}
.am-panel p{margin:4px 6px 8px;color:var(--mut)}
.am-row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:6px}
.am-row span{min-width:0;overflow-wrap:anywhere}
.am-row.orph span{color:var(--warn)}
</style>
<div class="am-ui" id="am-bar" role="toolbar" aria-label="Mark text" hidden>
<button type="button" data-a="hl">Highlight</button><span class="am-sw" role="group" aria-label="Highlight colour"><button type="button" class="sw" data-a="hl" data-c="green" aria-label="Green highlight" title="Green"></button><button type="button" class="sw" data-a="hl" data-c="blue" aria-label="Blue highlight" title="Blue"></button><button type="button" class="sw" data-a="hl" data-c="pink" aria-label="Pink highlight" title="Pink"></button><button type="button" class="sw" data-a="hl" data-c="orange" aria-label="Orange highlight" title="Orange"></button></span><button type="button" data-a="ul">Underline</button><button type="button" data-a="up" aria-label="Bigger text">A+</button><button type="button" data-a="dn" aria-label="Smaller text">A-</button><button type="button" data-a="rm">Remove</button>
</div>
<button type="button" class="am-ui am-pill" id="am-pill" hidden></button>
<div class="am-ui am-panel" id="am-panel" hidden></div>
<script>
(() => {
  const ROOT = document.querySelector("[data-annotate]"); if (!ROOT) return;
  const $ = id => document.getElementById(id), bar = $("am-bar"), pill = $("am-pill"), panel = $("am-panel");
  const LS = "am-marks", CTX = 32, KIND = { hl: "Highlight", ul: "Underline", none: "Size" };
  let marks = [], db = null, ro = false, stale = false, cur = null, orphans = [];
  const squash = s => s.replace(/\s/g, "");
  const local = {
    load() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } },
    save() { try { localStorage.setItem(LS, JSON.stringify(marks)); } catch {} },
    clear() { try { localStorage.removeItem(LS); } catch {} }
  };
  // Text model: ROOT's non-whitespace text t; starts[k] = index in t where text node nodes[k] begins.
  function model() {
    const w = document.createTreeWalker(ROOT, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("script,style") ? 2 : 1 });
    const nodes = [], starts = [], parts = []; let len = 0, n;
    while ((n = w.nextNode())) { const q = squash(n.data); if (!q) continue; nodes.push(n); starts.push(len); parts.push(q); len += q.length; }
    return { t: parts.join(""), nodes, starts };
  }
  function locate(M, k) { // t index -> [node position, char offset]
    let lo = 0, hi = M.nodes.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (M.starts[mid] <= k) lo = mid; else hi = mid - 1; }
    const d = M.nodes[lo].data; let c = M.starts[lo];
    for (let i = 0; i < d.length; i++) if (!/\s/.test(d[i])) { if (c === k) return [lo, i]; c++; }
    return [lo, d.length];
  }
  function idx(node, off) { const r = document.createRange(); r.setStart(ROOT, 0); r.setEnd(node, off); return squash(r.toString()).length; }
  function find(m, t) {
    let best = -1, score = -1, i = t.indexOf(m.quote);
    while (i >= 0) {
      let sc = 0; const p = m.before || "", x = m.after || "";
      for (let k = 1; k <= p.length && t[i - k] === p[p.length - k]; k++) sc++;
      for (let k = 0; k < x.length && t[i + m.quote.length + k] === x[k]; k++) sc++;
      if (sc > score) { score = sc; best = i; }
      i = t.indexOf(m.quote, i + 1);
    }
    return m.quote.length < 12 && score === 0 ? -1 : best; // a short quote needs some context to be trusted
  }
  function wrap(M, m, s, e) {
    const [k0, o0] = locate(M, s), [k1, o1] = locate(M, e - 1);
    for (let k = k1; k >= k0; k--) {
      const n = M.nodes[k], a = k === k0 ? o0 : 0, b = k === k1 ? o1 + 1 : n.data.length;
      const mid = a > 0 ? n.splitText(a) : n;
      if (b - a < mid.data.length) mid.splitText(b - a);
      const sp = document.createElement("span");
      sp.className = "am"; sp.dataset.id = m.id; sp.dataset.k = m.kind || "none"; if (m.kind === "hl" && m.color) sp.dataset.c = m.color; // no colour = yellow
      if (m.size) sp.style.fontSize = Math.pow(1.2, m.size).toFixed(3) + "em";
      mid.replaceWith(sp); sp.append(mid);
    }
  }
  function render() {
    ROOT.querySelectorAll("span.am").forEach(sp => sp.replaceWith(...sp.childNodes));
    ROOT.normalize();
    let M = model(); const hits = []; orphans = [];
    for (const m of marks) { if (typeof m.quote !== "string" || !m.quote) continue; const i = find(m, M.t); if (i < 0) orphans.push(m); else hits.push([i, i + m.quote.length, m]); }
    hits.sort((x, y) => y[0] - x[0]); // wrap from the end so earlier node offsets stay valid
    let low = Infinity;
    for (const [s0, e0, m] of hits) { if (e0 > low) M = model(); wrap(M, m, s0, e0); low = Math.min(low, s0); }
    const found = marks.length - orphans.length;
    pill.textContent = (marks.length ? found + (found === 1 ? " mark" : " marks") + (orphans.length ? ", " + orphans.length + " not found" : "") : "Select text to mark it") + (stale ? " (sync stopped, reload)" : "");
    pill.hidden = !marks.length && ro && !stale;
    if (!panel.hidden) list();
    if (cur && cur.id && !bar.hidden) { const sp = ROOT.querySelector('span.am[data-id="' + cur.id + '"]'); sp ? show(sp.getBoundingClientRect(), true) : hide(); }
  }
  function list() {
    panel.replaceChildren();
    const p = document.createElement("p");
    p.textContent = ro ? "Marks on this page (view only)." : "Select text to highlight, underline, or resize it.";
    panel.append(p);
    for (const m of marks) {
      const orph = orphans.includes(m), row = document.createElement("div"), s = document.createElement("span");
      row.className = "am-row" + (orph ? " orph" : "");
      s.textContent = (orph ? "Not found: " : KIND[m.kind || "none"] + (m.kind === "hl" && m.color && m.color !== "yellow" ? " (" + m.color + ")" : "") + ": ") + String(m.text || m.quote).slice(0, 80);
      row.append(s);
      if (!orph) s.onclick = () => { const sp = ROOT.querySelector('span.am[data-id="' + m.id + '"]'); if (!sp) return; for (let d = sp.closest("details"); d; d = d.parentElement.closest("details")) d.open = true; sp.scrollIntoView({ block: "center" }); };
      if (!ro) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Remove"; b.onclick = () => del(m.id); row.append(b); }
      panel.append(row);
    }
  }
  function fail(e) { if (e && (e.code === "invalid_argument" || e.code === "not_granted")) { ro = true; hide(); render(); } }
  function put(m) {
    if (db) { const { id, ...d } = m; db.collection("marks").doc(id).set(d).catch(fail); return; }
    const i = marks.findIndex(x => x.id === m.id); if (i < 0) marks.push(m); else marks[i] = m;
    local.save(); render();
  }
  function del(id) {
    if (db) { db.collection("marks").doc(id).delete().catch(fail); return; }
    marks = marks.filter(x => x.id !== id); local.save(); render();
  }
  function show(rect, edit) {
    bar.querySelector('[data-a="rm"]').hidden = !edit; bar.hidden = false;
  }
  function hide() { bar.hidden = true; cur = null; }
  function onSel(tg) {
    if (ro) return hide();
    const s = getSelection(); if (!s.rangeCount) return hide();
    const r = s.getRangeAt(0);
    if (!ROOT.contains(r.commonAncestorContainer)) return hide();
    if (s.isCollapsed) {
      const an = s.anchorNode, sp = (tg && tg.closest && tg.closest("span.am")) || (an && (an.nodeType === 1 ? an : an.parentElement).closest("span.am"));
      if (!sp) return hide();
      cur = { id: sp.dataset.id }; return show(sp.getBoundingClientRect(), true);
    }
    const a = idx(r.startContainer, r.startOffset), b = idx(r.endContainer, r.endOffset);
    if (b <= a) return hide();
    cur = { a, b, text: s.toString().replace(/\s+/g, " ").trim().slice(0, 300) };
    show(r.getBoundingClientRect(), false);
  }
  document.addEventListener("mouseup", e => { if (!e.target.closest(".am-ui")) setTimeout(() => onSel(e.target), 0); });
  document.addEventListener("keyup", e => { if (e.key === "Escape") hide(); else if (e.shiftKey) onSel(); });
  bar.addEventListener("mousedown", e => e.preventDefault());
  bar.addEventListener("click", e => {
    const btn = e.target.closest("button"), a = btn?.dataset.a; if (!a || !cur) return;
    let m;
    if (cur.id) { const o = marks.find(x => x.id === cur.id); if (!o) return hide(); m = { ...o }; }
    else {
      const t = model().t;
      m = { id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), quote: t.slice(cur.a, cur.b), before: t.slice(Math.max(0, cur.a - CTX), cur.a), after: t.slice(cur.b, cur.b + CTX), text: cur.text, kind: "none", size: 0, at: new Date().toISOString() };
    }
    if (a === "rm") { del(m.id); return hide(); }
    if (a === "hl") { const c = btn.dataset.c || "yellow"; m.kind = cur.id && m.kind === "hl" && (m.color || "yellow") === c ? "none" : "hl"; m.color = c; }
    if (a === "ul") m.kind = cur.id && m.kind === a ? "none" : a;
    if (m.kind !== "hl") delete m.color;
    if (a === "up") m.size = Math.min(4, (m.size || 0) + 1);
    if (a === "dn") m.size = Math.max(-2, (m.size || 0) - 1);
    if (m.kind === "none" && !m.size) { del(m.id); return hide(); }
    cur = { id: m.id }; getSelection().removeAllRanges(); put(m);
  });
  pill.addEventListener("click", () => { panel.hidden = !panel.hidden; if (!panel.hidden) list(); });
  marks = local.load(); render();
  (async () => {
    const c = window.claude; if (!c || !c.use) return;
    const [d, u] = await Promise.all([c.use("db"), c.use("user")]);
    if (u && (await u.canEdit()) === false) ro = true;
    if (!d) return render();
    db = d;
    const pending = ro ? [] : marks.slice();
    db.collection("marks").onSnapshot(s => { marks = s.docs.map(x => ({ id: x.id, ...x.data() })); render(); }, e => { stale = true; render(); fail(e); });
    if (pending.length) Promise.all(pending.map(m => { const { id, ...d } = m; return db.collection("marks").doc(id).set(d); })).then(local.clear, fail); // a failed upload keeps the local copy
    else if (!ro) local.clear();
  })();
})();
</script>
